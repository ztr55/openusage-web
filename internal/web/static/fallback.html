<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>OpenUsage Dashboard</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }

      p { color: #908e8b; line-height: 1.6; }

    <main>
      <h1>OpenUsage web assets are not built yet.</h1>
